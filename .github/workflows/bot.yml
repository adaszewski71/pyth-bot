name: pyth-bot
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      summary:
        description: 'Test daily summary 7:00 PL'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser
      - name: Run bot
        env:
          PHONE: ${{ secrets.PHONE }}
          APIKEY: ${{ secrets.APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ (github.event.schedule == '0 5 * * *' || inputs.summary) && '1' || '0' }}
        run: python bot.py
